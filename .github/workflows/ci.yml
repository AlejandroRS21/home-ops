name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/

      - name: Type check with mypy
        run: mypy src/

      - name: Test with pytest
        run: pytest --cov --cov-report=term-missing

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: homeops-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test non-root user
        run: |
          USER_ID=$(docker run --rm homeops-smoke:latest id -u)
          if [ "$USER_ID" != "10001" ]; then
            echo "Expected UID 10001, got $USER_ID"
            exit 1
          fi

      - name: Smoke test CLI entrypoint
        run: docker run --rm homeops-smoke:latest homeops --help

      - name: Smoke test Python import
        run: docker run --rm homeops-smoke:latest python -c "import home_ops; print('IMPORT_OK')"
