name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Test with pytest
        run: uv run pytest --cov --cov-report=term-missing

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: homeops-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test non-root user
        run: |
          USER_ID=$(docker run --rm homeops-smoke:latest id -u)
          if [ "$USER_ID" != "10001" ]; then
            echo "Expected UID 10001, got $USER_ID"
            exit 1
          fi

      - name: Smoke test CLI entrypoint
        run: docker run --rm homeops-smoke:latest homeops --help

      - name: Smoke test Python import
        run: docker run --rm homeops-smoke:latest python -c "import home_ops; print('IMPORT_OK')"

      - name: Smoke test profile bootstrap from empty config dir
        run: |
          CFG_DIR=$(mktemp -d)
          DATA_VOL=$(docker volume create)
          docker run -d --name homeops-bootstrap \
            -v "$CFG_DIR":/app/config:ro \
            -v "$DATA_VOL":/app/data \
            homeops-smoke:latest
          STATUS=""
          for _ in $(seq 1 60); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' homeops-bootstrap 2>/dev/null || true)
            [ "$STATUS" = "healthy" ] && break
            sleep 2
          done
          if [ "$STATUS" != "healthy" ]; then
            docker logs homeops-bootstrap
            echo "Bootstrap container never became healthy"
            docker rm -f homeops-bootstrap
            exit 1
          fi
          # Profile provisioned from template into the data volume
          docker exec homeops-bootstrap test -f /app/data/user_profile.yml
          docker cp homeops-bootstrap:/app/data/user_profile.yml /tmp/bootstrap_first.yml
          docker rm -f homeops-bootstrap

          # Second boot over the SAME data volume: idempotent, no overwrite
          docker run -d --name homeops-bootstrap-2 \
            -v "$CFG_DIR":/app/config:ro \
            -v "$DATA_VOL":/app/data \
            homeops-smoke:latest
          STATUS=""
          for _ in $(seq 1 60); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' homeops-bootstrap-2 2>/dev/null || true)
            [ "$STATUS" = "healthy" ] && break
            sleep 2
          done
          if [ "$STATUS" != "healthy" ]; then
            docker logs homeops-bootstrap-2
            docker rm -f homeops-bootstrap-2
            docker volume rm "$DATA_VOL"
            exit 1
          fi
          docker cp homeops-bootstrap-2:/app/data/user_profile.yml /tmp/bootstrap_second.yml
          cmp -s /tmp/bootstrap_first.yml /tmp/bootstrap_second.yml
          docker rm -f homeops-bootstrap-2
          docker volume rm "$DATA_VOL"

  release:
    # Publish a versioned image to GHCR on version tags (v*) only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
